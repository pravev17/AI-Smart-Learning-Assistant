<!DOCTYPE html>
<html>

<head>

    <title>Quiz Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>AI Smart Learning Assistant</h1>

    <h2>Quiz Completed Successfully</h2>

    <hr>

    <h3>Welcome {{ name }}</h3>

    <p><b>Register Number :</b> {{ regno }}</p>

    <p><b>Subject :</b> {{ subject }}</p>

    <p><b>Level :</b> {{ level }}</p>

    <hr>

    <h2>Your Score</h2>

    <h1>{{ score }}/5</h1>

    <h3>{{ percentage }}%</h3>

    <br>

    <form action="/dashboard" method="POST">

        <input type="hidden" name="name" value="{{ name }}">

        <button type="submit">
            Go to Dashboard
        </button>

    </form>

</div>

</body>

</html>
